<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — SportMax</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-body">

  <div class="login-box">

    <!-- Nombre del negocio -->
    <div class="login-logo">Sport<span>Max</span></div>
    <p class="login-subtitle">Ingresa tus credenciales para continuar</p>

    <!--
      Formulario de inicio de sesión.
      La validación se realiza en js/login.js con credenciales
      quemadas en el código (solo con fines educativos).
    -->
    <form id="loginForm" novalidate>

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Ej: admin"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn-login-submit">Ingresar</button>

      <!-- Mensaje de error (se rellena desde JS) -->
      <p class="login-error" id="errorMsg" role="alert"></p>

    </form>

    <p class="login-hint">
      Usuarios de prueba (solo educativo):<br>
      <strong>admin / 1234</strong> &nbsp;·&nbsp;
      juan / deportes &nbsp;·&nbsp;
      maria / sportmax
    </p>

  </div>

  <script src="js/login.js"></script>

</body>
</html>
