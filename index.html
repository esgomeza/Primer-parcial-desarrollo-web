<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportMax — Tienda Deportiva</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Header + Nav (inyectado por components.js) -->
  <div id="header"></div>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-content">
      <span class="hero-badge">🔥 Temporada 2026</span>
      <h1>Viste Tu<br><em>Mejor</em><br>Versión</h1>
      <p>Ropa y equipamiento deportivo de alto rendimiento. Encuentra todo lo que necesitas para entrenar, competir y ganar.</p>
      <div class="hero-cta">
        <button class="btn-primary" onclick="document.getElementById('products').scrollIntoView({behavior:'smooth'})">
          Ver productos
        </button>
        <button class="btn-outline" onclick="filtrarPorCategoria('ofertas', null)">
          Ver ofertas →
        </button>
      </div>
      <div class="hero-stats">
        <div>
          <div class="stat-num">500+</div>
          <div class="stat-label">Productos</div>
        </div>
        <div>
          <div class="stat-num">12K</div>
          <div class="stat-label">Clientes</div>
        </div>
        <div>
          <div class="stat-num">4.9★</div>
          <div class="stat-label">Calificación</div>
        </div>
      </div>
    </div>
    <div class="hero-visual">
      <div class="hero-card">
        <div class="hero-emoji">🏆</div>
        <div class="hero-tag">SPORT MAX</div>
      </div>
    </div>
  </section>

  <!-- Layout principal -->
  <div class="layout">

    <!-- Sidebar (opcional) -->
    <div id="sidebar"></div>

    <!-- Contenido principal -->
    <main class="main-section">
      <div class="section-header">
        <h2 class="section-title">Productos Deportivos</h2>
        <span class="products-count" id="productsCount">Cargando...</span>
      </div>

      <!-- Grid de productos (inyectado por products.js) -->
      <div class="products-grid" id="products"></div>

    </main>

  </div>

  <!-- Footer (inyectado por components.js) -->
  <div id="footer"></div>

  <!-- Template para tarjetas de producto -->
  <template id="productTemplate">
    <div class="product-card">
      <div class="product-img">
        <span class="product-emoji"></span>
        <span class="product-badge"></span>
      </div>
      <div class="product-info">
        <div class="product-cat"></div>
        <h3 class="product-name"></h3>
        <p class="product-desc"></p>
        <div class="product-footer">
          <span class="product-price"></span>
          <button class="btn-add">+ Añadir</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Scripts: orden importa -->
  <script src="components/components.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>

</body>
</html>
